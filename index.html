<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uang Digital Al-Islam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Tambahkan library html5-qrcode untuk akses kamera HP -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    /* Styling scrollbar tipis agar modern */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased overflow-hidden">
  
  <!-- Container Utama Aplikasi -->
  <div id="app"></div>

  <!-- Modal Container Universal -->
  <div id="modal-container"></div>
  
  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-white bg-opacity-80 flex flex-col items-center justify-center z-50 hidden transition-opacity duration-300">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-green-200 border-t-green-600 mb-4"></div>
    <p class="text-green-800 font-semibold animate-pulse tracking-wide">Menyinkronkan Data...</p>
  </div>

  <script>
    const AppState = {
      user: null, 
      mySaldo: 0 // cache untuk saldo pedagang saat ini
    };
    
    // VARIABEL CACHE GLOBAL: Agar loading tidak muncul berulang
    const AppCache = {};

    function clearCache(tableName = null) {
      if (tableName) {
        delete AppCache[tableName];
      } else {
        for (let key in AppCache) delete AppCache[key];
      }
    }

    // Variabel ini akan diisi dari LocalStorage, sehingga satu frontend
    // bisa dipakai untuk backend web app yang berbeda-beda tanpa hardcoding
    let API_URL = ""; 

    document.addEventListener("DOMContentLoaded", () => {
      const savedAPI = localStorage.getItem('BAZAR_API_URL');
      if(!savedAPI) {
        renderSetupAPI(); // Pertama kali dibuka, minta URL
      } else {
        API_URL = savedAPI;
        renderLogin();    // Sudah ada URL, arahkan ke Login
      }
    });

    function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

    function showToast(msg, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `fixed top-6 right-6 px-6 py-4 rounded-lg text-white shadow-xl z-[9999] transform transition-all translate-y-0 opacity-100 flex items-center ${type === 'error' ? 'bg-red-500' : 'bg-emerald-600'}`;
      toast.innerHTML = `<span class="mr-2">${type==='error'?'❌':'✅'}</span> <span class="font-medium">${msg}</span>`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('-translate-y-4', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    } 

    function openModal(title, contentHTML) {
      const container = document.getElementById('modal-container');
      container.innerHTML = `
        <div id="dynamic-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-sm flex items-center justify-center z-40 p-4 transition-opacity">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg transform transition-all duration-300 scale-100">
            <div class="flex justify-between items-center px-6 py-4 border-b border-gray-100">
              <h3 class="text-xl font-bold text-gray-800">${title}</h3>
              <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition-colors font-bold text-xl leading-none">&times;</button>
            </div>
            <div class="p-6 max-h-[75vh] overflow-y-auto">
              ${contentHTML}
            </div>
          </div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    function confirmAction(message, callback) {
      const html = `
        <p class="mb-6 text-gray-600 text-lg">${message}</p>
        <div class="flex justify-end gap-3">
          <button onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition-colors">Batal</button>
          <button id="btn-confirm-ok" class="px-5 py-2.5 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg shadow-md transition-colors">Ya, Lanjutkan</button>
        </div>
      `;
      openModal('Konfirmasi Tindakan', html);
      document.getElementById('btn-confirm-ok').onclick = () => {
        closeModal();
        callback();
      };
    }

    async function fetchAPI(action, payload = {}, silent = false) {
      if(!silent) showLoading();
      try {
        // PERHATIAN: Kita menggunakan method POST tapi content-type 'text/plain' 
        // Ini adalah cara rahasia menembus batasan CORS Google Apps Script dari domain Vercel.
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action, data: payload }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        
        const json = await res.json();
        if(!silent) hideLoading();
        
        if(json.success) {
          return json.data;
        } else {
          showToast(json.error, 'error');
          return null;
        }
      } catch(e) {
        if(!silent) hideLoading();
        showToast("Gagal menyambung ke Database. Periksa URL Apps Script Anda.", 'error');
        console.error(e);
        return null;
      }
    }

    // FUNGSI BARU: Ambil data tabel dengan Caching agar klik menu instan
    async function getTableData(tableName, forceRefresh = false) {
      if (!forceRefresh && AppCache[tableName]) {
        return AppCache[tableName];
      }
      // Panggil API secara silent (tanpa loading overlay hitam)
      const data = await fetchAPI('get_data', {table: tableName}, true);
      if (data) {
        AppCache[tableName] = data;
      }
      return data;
    }

    function renderSetupAPI() {
      const current = localStorage.getItem('BAZAR_API_URL') || '';
      document.getElementById('app').innerHTML = `
        <div class="flex min-h-screen items-center justify-center bg-gray-100 p-4">
           <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg border border-gray-100">
              <div class="flex items-center mb-6">
                <div class="bg-blue-100 p-3 rounded-full mr-4 text-blue-600 text-2xl">🔗</div>
                <h2 class="text-2xl font-bold text-gray-800">Setup Database</h2>
              </div>
              
              <p class="text-sm mb-6 text-gray-600 leading-relaxed bg-blue-50 p-4 rounded-lg">
                Karena frontend ini berada di Vercel, kita perlu menyambungkannya dengan backend (Google Apps Script). 
                Masukkan <b>URL Web App</b> yang Anda dapatkan setelah melakukan Deploy di Google Apps Script.
              </p>
              
              <input type="text" id="api-url-input" class="w-full border-2 border-gray-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 p-3 rounded-lg mb-6 outline-none transition-all" placeholder="https://script.google.com/macros/s/AKfycb.../exec" value="${current}">
              
              <div class="flex gap-3">
                <button onclick="saveAPIUrl()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg shadow-md transition-colors">Simpan Endpoint</button>
                ${current ? `<button onclick="renderLogin()" class="px-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold p-3 rounded-lg transition-colors">Batal</button>` : ''}
              </div>
              <p class="mt-6 text-xs text-center text-gray-400 cursor-pointer hover:text-blue-500" onclick="window.open(document.getElementById('api-url-input').value+'?action=setup', '_blank')">Klik di sini untuk Auto-Generate Table jika URL baru ditambahkan</p>
           </div>
        </div>
      `;
    }

    function saveAPIUrl() {
      const url = document.getElementById('api-url-input').value.trim();
      if(!url.startsWith('https://script.google.com/')) {
        return showToast('Format URL Apps Script tidak valid! Harus berawalan https://script.google.com/...', 'error');
      }
      localStorage.setItem('BAZAR_API_URL', url);
      API_URL = url;
      showToast('Endpoint Database berhasil diamankan');
      renderLogin();
    }

    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="flex min-h-screen flex-col md:flex-row bg-green-50">
          
          <div class="absolute top-4 right-4 z-10 text-green-800 bg-white/50 backdrop-blur px-4 py-2 rounded-full cursor-pointer font-medium hover:bg-white shadow-sm transition-all text-sm" onclick="renderSetupAPI()">⚙️ Pengaturan API</div>
          
          <!-- Banner Section (Desktop) -->
          <div class="md:flex-1 bg-green-800 text-white p-12 flex-col justify-center hidden md:flex relative overflow-hidden">
             <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/arabesque.png')] opacity-10"></div>
             <div class="relative z-10">
               <h1 class="text-5xl font-extrabold mb-6 leading-tight">Sistem Uang Digital<br>Ponpes Al-Islam</h1>
               <p class="text-xl text-green-100 leading-relaxed font-light">
                 Mengubah transaksi tunai menjadi digital menggunakan voucher QR Code. Aman, Cepat, dan Transparan.
               </p>
             </div>
          </div>

          <!-- Form Login Section -->
          <div class="flex-1 flex items-center justify-center p-6 bg-white relative shadow-[-10px_0_30px_rgba(0,0,0,0.05)]">
             <div class="w-full max-w-sm">
                <div class="text-center mb-8 md:hidden">
                   <h2 class="text-3xl font-extrabold text-green-800">Bazar Al-Islam</h2>
                   <p class="text-gray-500 mt-2">Masuk ke Sistem</p>
                </div>
                
                <h3 class="text-2xl font-bold text-gray-800 mb-6 hidden md:block">Masuk ke Akun Anda</h3>
                
                <form onsubmit="doLogin(event)" class="space-y-5">
                  <div>
                    <label class="block text-gray-700 font-medium mb-1.5 text-sm">Username / ID Pegawai</label>
                    <input type="text" id="val-u" class="w-full bg-gray-50 border border-gray-300 focus:border-green-500 focus:bg-white p-3.5 rounded-xl outline-none transition-all shadow-sm" required placeholder="Masukkan username">
                  </div>
                  <div>
                    <label class="block text-gray-700 font-medium mb-1.5 text-sm">Kata Sandi</label>
                    <input type="password" id="val-p" class="w-full bg-gray-50 border border-gray-300 focus:border-green-500 focus:bg-white p-3.5 rounded-xl outline-none transition-all shadow-sm" required placeholder="••••••••">
                  </div>
                  <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_4px_14px_0_rgba(22,163,74,0.39)] hover:shadow-[0_6px_20px_rgba(22,163,74,0.23)] hover:-translate-y-0.5 transition-all mt-4">Login Sekarang</button>
                </form>
             </div>
          </div>
        </div>
      `;
    }

    async function doLogin(e) {
      e.preventDefault();
      const u = document.getElementById('val-u').value;
      const p = document.getElementById('val-p').value;
      
      const res = await fetchAPI('login', { username: u, password: p });
      if(res) {
        AppState.user = res;
        clearCache(); // Bersihkan memori cache saat login user baru
        showToast(`Selamat datang, ${res.username}!`);
        renderMainApp();
      }
    }

    function logout() {
      AppState.user = null;
      renderLogin();
    }

    const RoleMenus = {
      admin: [
        { id: 'dashboard_admin', icon: '🏠', label: 'Dashboard Utama', action: renderDashboardAdmin },
        { id: 'jadwal_pedagang', icon: '📅', label: 'Jadwal Rolling', action: renderJadwalPedagang },
        { id: 'master_santri', icon: '👨‍🎓', label: 'Master Santri', action: renderMasterSantri },
        { id: 'master_pedagang', icon: '🏪', label: 'Master Pedagang', action: renderMasterPedagang },
        { id: 'absensi_pedagang', icon: '📷', label: 'Absensi Pedagang', action: renderAbsensi },
        { id: 'laporan_admin', icon: '📊', label: 'Laporan Global', action: renderLaporanGlobal }
      ],
      bendahara: [
        { id: 'dashboard_bendahara', icon: '🏠', label: 'Dashboard Utama', action: renderDashboardBendahara },
        { id: 'pencairan_dana', icon: '💸', label: 'Pencairan Dana', action: renderApprovePencairan },
        { id: 'setoran_dana', icon: '📥', label: 'Setoran Pedagang', action: renderSetoran },
        { id: 'bayar_kegiatan', icon: '📋', label: 'Pembayaran Santri', action: renderBayarKegiatan },
        { id: 'laporan_bendahara', icon: '📉', label: 'Laporan Keuangan', action: renderLaporanGlobal }
      ],
      pedagang: [
        { id: 'jajan_input', icon: '🛒', label: 'Proses Jajan', action: renderInputJajan },
        { id: 'ajukan_wd', icon: '💰', label: 'Ajukan Pencairan', action: renderAjukanWD }
      ],
      edc: [
        { id: 'topup_saldo', icon: '💳', label: 'Topup Voucher', action: renderTopup },
        { id: 'bayar_kegiatan', icon: '📋', label: 'Pembayaran Santri', action: renderBayarKegiatan }
      ]
    };

    function renderMainApp() {
      document.getElementById('app').innerHTML = `
        <div class="flex h-screen bg-gray-50 font-sans overflow-hidden">
          
          <!-- Sidebar -->
          <aside class="w-72 bg-gray-900 text-gray-300 flex flex-col shadow-2xl transition-transform duration-300 transform md:translate-x-0 -translate-x-full absolute md:relative z-30 h-full" id="sidebar">
            <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-gray-950">
              <div class="flex items-center gap-3">
                <span class="text-xl font-bold text-white tracking-wide">Uang Digital</span>
                 <div class="bg-green-500 w-8 h-8 rounded flex items-center justify-center text-white font-bold">A</div>
                 
              </div>
              <button class="md:hidden text-gray-400 hover:text-white" onclick="toggleSidebar()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>
            
            <div class="p-5 border-b border-gray-800 bg-gray-900 flex items-center gap-4">
              <div class="w-12 h-12 bg-gray-800 rounded-full flex items-center justify-center text-xl font-bold text-green-400 border border-green-500/30">
                 ${AppState.user.username.charAt(0).toUpperCase()}
              </div>
              <div>
                <p class="text-white font-semibold">${AppState.user.username}</p>
                <p class="text-xs text-green-500 bg-green-500/10 inline-block px-2 py-0.5 rounded-full mt-1 border border-green-500/20">${AppState.user.role.toUpperCase()}</p>
              </div>
            </div>
            
            <div class="p-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Menu Navigasi</div>
            <nav class="flex-1 overflow-y-auto px-3 pb-4 space-y-1" id="sidebar-nav"></nav>
            
           <div class="p-4 border-t border-gray-800 space-y-2">
               <!-- Tombol Refresh -->
               <button onclick="refreshAppData()" class="w-full flex items-center justify-center gap-2 p-3 bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 rounded-lg transition-colors font-medium shadow-sm">
                 <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                 Segarkan Data
               </button>
               
               <button onclick="logout()" class="w-full flex items-center justify-center gap-2 p-3 bg-red-500/10 hover:bg-red-500/20 text-red-500 rounded-lg transition-colors font-medium">
                 <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                 Keluar Sistem
               </button>
            </div>
          </aside>
          
          <!-- Area Konten -->
          <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
            
           <!-- Mobile Header -->
            <header class="bg-white shadow-sm border-b border-gray-200 p-4 flex md:hidden items-center justify-between z-20">
              <div class="flex items-center gap-3">
                 <button onclick="toggleSidebar()" class="text-gray-800 focus:outline-none p-1 bg-gray-100 rounded-md">
                   <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                 </button>
                 <span class="text-lg font-bold text-gray-800">Bazar Apps</span>
              </div>
              <div class="flex items-center gap-3">
                 <!-- Tombol Refresh Mobile -->
                 <button onclick="refreshAppData()" class="text-blue-600 focus:outline-none p-1.5 bg-blue-50 hover:bg-blue-100 rounded-md transition-colors border border-blue-100">
                   <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                 </button>
                 <div class="w-8 h-8 bg-green-100 text-green-700 rounded-full flex items-center justify-center font-bold text-sm border border-green-200">
                    ${AppState.user.username.charAt(0).toUpperCase()}
                 </div>
              </div>
            </header>
            
            <!-- Tempat merender View -->
            <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full relative" id="main-content"></main>
            
            <!-- Overlay untuk mematikan sidebar saat mobile -->
            <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity"></div>
          </div>
        </div>
      `;
      
      const roleMenus = RoleMenus[AppState.user.role];
      if(!roleMenus) return showToast('Hak Akses Role tidak dikenali', 'error');
      
      const nav = document.getElementById('sidebar-nav');
      nav.innerHTML = roleMenus.map((m, i) => `
        <button onclick="loadMenu(${i}, this)" class="menu-btn w-full flex items-center gap-3 text-left px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition-all">
          <span class="text-xl">${m.icon}</span> 
          <span class="font-medium">${m.label}</span>
        </button>
      `).join('');
      
      // Jika pedagang, tampilkan Info Khusus Jadwal Dagang sebagai home, jika bukan muat menu indeks 0
      if(AppState.user.role === 'pedagang') {
         renderDashboardPedagang();
      } else {
         loadMenu(0, document.querySelector('.menu-btn'));
      }
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if(sb.classList.contains('-translate-x-full')) {
         sb.classList.remove('-translate-x-full');
         overlay.classList.remove('hidden');
      } else {
         sb.classList.add('-translate-x-full');
         overlay.classList.add('hidden');
      }
    }

    function loadMenu(index, btnEl) {
      // Styling tombol menu aktif
      if(btnEl) {
        document.querySelectorAll('.menu-btn').forEach(b => {
          b.classList.remove('bg-gray-800', 'text-white', 'shadow-inner');
          b.classList.add('text-gray-400');
        });
        btnEl.classList.remove('text-gray-400');
        btnEl.classList.add('bg-gray-800', 'text-white', 'shadow-inner');
      }
      
      const roleMenus = RoleMenus[AppState.user.role];
      if(window.innerWidth < 768) toggleSidebar();
      roleMenus[index].action();
    }

    async function renderMasterSantri() {
      document.getElementById('main-content').innerHTML = `
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
           <div>
             <h2 class="text-3xl font-extrabold text-gray-800 tracking-tight">Master Data Santri</h2>
             <p class="text-gray-500 mt-1">Kelola data peserta bazar dan saldo vouchernya.</p>
           </div>
           <button onclick="openModalSantri()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg shadow-sm flex items-center gap-2 transition-colors">
             <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Tambah Santri Baru
           </button>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
           <div class="overflow-x-auto">
             <table class="w-full text-left whitespace-nowrap">
               <thead class="bg-gray-50 border-b border-gray-100 text-gray-600 uppercase text-xs font-bold tracking-wider">
                 <tr>
                   <th class="px-6 py-4">ID Santri</th>
                   <th class="px-6 py-4">Nama Lengkap</th>
                   <th class="px-6 py-4">Rayon</th>
                   <th class="px-6 py-4 text-right">Saldo (Rp)</th>
                   <th class="px-6 py-4 text-center">Aksi / Cetak</th>
                 </tr>
               </thead>
               <tbody id="tb-santri" class="divide-y divide-gray-100">
                 <tr><td colspan="5" class="px-6 py-8 text-center text-gray-500"><div class="animate-pulse flex flex-col items-center"><div class="h-4 bg-gray-200 rounded w-1/4 mb-2"></div><div class="h-4 bg-gray-100 rounded w-1/3"></div></div></td></tr>
               </tbody>
             </table>
           </div>
        </div>
      `;
      
      const data = await getTableData('Santri');
      if (data) {
        document.getElementById('tb-santri').innerHTML = data.map(s => `
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 font-medium text-gray-900">${s.id_santri}</td>
            <td class="px-6 py-4">${s.nama}</td>
            <td class="px-6 py-4"><span class="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-semibold">${s.rayon}</span></td>
            <td class="px-6 py-4 text-right font-mono font-medium text-green-600">${parseInt(s.saldo||0).toLocaleString('id-ID')}</td>
            <td class="px-6 py-4 text-center space-x-2">
              <!-- Tambahkan s.saldo pada parameter fungsi showQR -->
              <button onclick="showQR('${s.id_santri}', '${s.nama}', ${s.saldo})" class="text-gray-500 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded text-sm font-medium transition-colors">🖨️ QR</button>
              <button onclick='openModalSantri(${JSON.stringify(s)})' class="text-blue-600 hover:text-blue-900 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded text-sm font-medium transition-colors">Edit</button>

    // Variabel Scanner khusus Absensi
    let html5QrCodeAbsen = null;

    function toggleKameraAbsen() {
      const container = document.getElementById('reader-absen-container');
      const btnKamera = document.getElementById('btn-kamera-absen');

      if (html5QrCodeAbsen && html5QrCodeAbsen.isScanning) {
        stopKameraAbsen();
        return;
      }

      container.classList.remove('hidden');
      btnKamera.innerHTML = '❌ Tutup Kamera Scanner';
      btnKamera.classList.replace('bg-emerald-50', 'bg-red-50');
      btnKamera.classList.replace('text-emerald-700', 'text-red-600');
      btnKamera.classList.replace('border-emerald-200', 'border-red-200');

      html5QrCodeAbsen = new Html5Qrcode("reader-absen");
      html5QrCodeAbsen.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          try { navigator.vibrate(200); } catch(e){}
          stopKameraAbsen();
          document.getElementById('a-id').value = decodedText;
          submitAbsensi(decodedText); // Eksekusi absensi secara otomatis
        },
        (errorMessage) => { }
      ).catch(() => {
        showToast('Gagal mengakses kamera.', 'error');
        stopKameraAbsen();
      });
    }

    function stopKameraAbsen() {
      if (html5QrCodeAbsen && html5QrCodeAbsen.isScanning) {
        html5QrCodeAbsen.stop().then(() => { html5QrCodeAbsen.clear(); }).catch(e => console.log(e));
      }
      const container = document.getElementById('reader-absen-container');
      const btnKamera = document.getElementById('btn-kamera-absen');
      if(container && btnKamera) {
        container.classList.add('hidden');
        btnKamera.innerHTML = '📷 Buka Kamera Scanner';
        btnKamera.classList.replace('bg-red-50', 'bg-emerald-50');
        btnKamera.classList.replace('text-red-600', 'text-emerald-700');
        btnKamera.classList.replace('border-red-200', 'border-emerald-200');
      }
    }

    function toggleJadwalGroup(type) {
      const checkboxes = document.querySelectorAll('.cb-jadwal');
      checkboxes.forEach((cb, index) => {
        if(type === 'all') cb.checked = true;
        if(type === 'none') cb.checked = false;
        if(type === 'grup1') cb.checked = (index % 2 === 0);
        if(type === 'grup2') cb.checked = (index % 2 !== 0);
      });
    }

      confirmAction(`Anda akan mengatur <b>${activeIds.length} pedagang</b> menjadi AKTIF, dan sisanya diliburkan.<br>Lanjutkan?`, async () => {

    async function cekPedagangSetoran() {
      const query = document.getElementById('s-id').value.trim();
      if(!query) return;
      
      const infoBox = document.getElementById('s-info-box');
      infoBox.classList.remove('hidden');
      infoBox.innerHTML = '<span class="animate-pulse text-gray-500 text-sm font-medium">Mencari data pedagang...</span>';
      
      const data = await getTableData('Pedagang');
      if(data) {
        const pedagang = data.find(p => p.id_pedagang.toUpperCase() === query.toUpperCase() || p.nama.toLowerCase().includes(query.toLowerCase()));
        if(pedagang) {
           document.getElementById('s-id').value = pedagang.id_pedagang;
           document.getElementById('s-id').dataset.nama = pedagang.nama; // Simpan nama asli
           
           infoBox.classList.remove('bg-red-50', 'border-red-100');
           infoBox.classList.add('bg-emerald-50', 'border-emerald-200');
           infoBox.innerHTML = `<span class="font-bold text-emerald-800 text-lg">✅ ${pedagang.nama}</span> <br><span class="text-sm font-medium text-emerald-700">ID: ${pedagang.id_pedagang}</span>`;
           document.getElementById('s-nom').focus();
        } else {
           infoBox.classList.remove('bg-emerald-50', 'border-emerald-200');
           infoBox.classList.add('bg-red-50', 'border-red-100');
           infoBox.innerHTML = '❌ <span class="text-red-600 text-sm font-bold">Data Pedagang tidak ditemukan!</span>';
        }
      }
    }

    async function submitSetoran() {
      const idInput = document.getElementById('s-id');
      const nama = idInput.dataset.nama;
      const jenis = document.getElementById('s-jenis').value;
      const nom = document.getElementById('s-nom').value;
      
      if(!idInput.value || !nama) return showToast('Harap cari dan pilih pedagang terlebih dahulu', 'error');
      if(!nom || nom <= 0) return showToast('Nominal setoran tidak valid', 'error');
      
      const data = {
        id_pedagang: idInput.value,
        nama_pedagang: nama,
        jenis: jenis,
        nominal: nom
      };
      
      const res = await fetchAPI('catat_setoran', data);
      if(res) {
        clearCache('Setoran'); // Bersihkan cache tabel setoran
        showToast('Setoran berhasil dicatat!');
        renderSetoran(); // Reset form
      }
    }

    // Variabel global untuk menyimpan state kamera
    let html5QrCode = null;

    function toggleKamera() {
      const container = document.getElementById('reader-container');
      const btnKamera = document.getElementById('btn-kamera');

      // Jika kamera sedang menyala, matikan
      if (html5QrCode && html5QrCode.isScanning) {
        stopKamera();
        return;
      }

      // Jika belum menyala, inisialisasi dan nyalakan
      container.classList.remove('hidden');
      btnKamera.innerHTML = '❌ Tutup Kamera';
      btnKamera.classList.replace('bg-indigo-50', 'bg-red-50');
      btnKamera.classList.replace('text-indigo-700', 'text-red-600');
      btnKamera.classList.replace('border-indigo-200', 'border-red-200');

      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };
      
      html5QrCode.start(
        { facingMode: "environment" }, // Gunakan kamera belakang HP
        config,
        (decodedText) => {
          // Ketika QR berhasil terbaca
          document.getElementById('j-id').value = decodedText;
          // Mainkan suara beep kecil (opsional jika support)
          try { navigator.vibrate(200); } catch(e){}
          
          stopKamera();
          showToast('QR Code berhasil di-scan!', 'info');
          // Arahkan fokus ke input nominal belanja
          document.getElementById('j-nom').focus();
        },
        (errorMessage) => {
          // Abaikan error saat proses scan berlangsung (frame kosong, dll)
        }
      ).catch((err) => {
        showToast('Gagal mengakses kamera. Pastikan Anda memberi izin kamera di browser.', 'error');
        stopKamera();
      });
    }

    function stopKamera() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
        }).catch(err => console.log(err));
      }
      
      const container = document.getElementById('reader-container');
      const btnKamera = document.getElementById('btn-kamera');
      
      if(container && btnKamera) {
        container.classList.add('hidden');
        btnKamera.innerHTML = '📷 Buka Kamera HP untuk Scan QR';
        btnKamera.classList.replace('bg-red-50', 'bg-indigo-50');
        btnKamera.classList.replace('text-red-600', 'text-indigo-700');
        btnKamera.classList.replace('border-red-200', 'border-indigo-200');
      }
    }

    // ==========================================
    // FITUR EXPORT / DOWNLOAD LAPORAN (EXCEL/CSV)
    // ==========================================
    window.exportLaporanCSV = function() {
        const setoranData = AppCache['Setoran'];
        if(!setoranData || setoranData.length === 0) {
            return showToast('Tidak ada data setoran untuk di-download!', 'error');
        }
        
        // Buat Kamus Rekap
        const rekap = {};
        let totalAllShodaqoh = 0;
        let totalAllSewa = 0;

        setoranData.forEach(s => {
            if(!rekap[s.id_pedagang]) rekap[s.id_pedagang] = { nama: s.nama_pedagang, shodaqoh: 0, sewa: 0 };
            let nom = parseInt(s.nominal||0);
            if(s.jenis === 'Shodaqoh') { rekap[s.id_pedagang].shodaqoh += nom; totalAllShodaqoh += nom; }
            if(s.jenis === 'Sewa Tenda') { rekap[s.id_pedagang].sewa += nom; totalAllSewa += nom; }
        });

        // Susun teks format CSV (Menggunakan pemisah Titik Koma agar rapih di Excel Indonesia)
        let csvContent = "ID Pedagang;Nama Pedagang;Total Shodaqoh;Total Sewa Tenda;Grand Total\n";
        
        for (const [id, data] of Object.entries(rekap)) {
            let grandTotal = data.shodaqoh + data.sewa;
            csvContent += `${id};${data.nama};${data.shodaqoh};${data.sewa};${grandTotal}\n`;
        }
        
        // Tambahkan baris paling bawah untuk Total Semua
        csvContent += `\nTOTAL KESELURUHAN;;${totalAllShodaqoh};${totalAllSewa};${totalAllShodaqoh + totalAllSewa}\n`;
        
        // Proses Download File
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        
        link.setAttribute("href", url);
        link.setAttribute("download", `Rekap_Setoran_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        showToast('Laporan berhasil di-download! Silakan buka menggunakan Excel.');
    };

    async function cekSantriBayar() {
      const query = document.getElementById('b-id').value.trim();

      infoBox.innerHTML = '<span class="animate-pulse text-gray-500 text-sm font-medium">Mencari data santri...</span>';
      
      const data = await getTableData('Santri');
      if(data) {
        const santri = data.find(s => s.id_santri.toUpperCase() === query.toUpperCase() || s.nama.toLowerCase().includes(query.toLowerCase()));
        if(santri) {
           document.getElementById('b-id').value = santri.id_santri;
           infoBox.className = 'mt-3 p-3 rounded-xl border bg-green-50 border-green-200';
           infoBox.innerHTML = `

             </div>
           `;
           document.getElementById('b-nom').focus();
        } else {
           infoBox.className = 'mt-3 p-3 rounded-xl border bg-red-50 border-red-100';
           infoBox.innerHTML = '❌ <span class="text-red-600 text-sm font-bold">Santri tidak ditemukan!</span>';
        }
      }
    }

    let html5QrCodeBayar = null;
    function toggleKameraBayar() {
      const container = document.getElementById('reader-bayar-container');
      const btnKamera = document.getElementById('btn-kamera-bayar');

      if (html5QrCodeBayar && html5QrCodeBayar.isScanning) {
        html5QrCodeBayar.stop().then(() => { html5QrCodeBayar.clear(); }).catch(err => console.log(err));
        container.classList.add('hidden');
        btnKamera.innerHTML = '📷 Buka Scanner QR Santri';
        btnKamera.classList.replace('bg-red-50', 'bg-blue-50');
        btnKamera.classList.replace('text-red-600', 'text-blue-700');
        return;
      }

      container.classList.remove('hidden');
      btnKamera.innerHTML = '❌ Tutup Kamera';
      btnKamera.classList.replace('bg-blue-50', 'bg-red-50');
      btnKamera.classList.replace('text-blue-700', 'text-red-600');

      html5QrCodeBayar = new Html5Qrcode("reader-bayar");
      html5QrCodeBayar.start(
        { facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          document.getElementById('b-id').value = decodedText;
          try { navigator.vibrate(200); } catch(e){}
          toggleKameraBayar(); // Matikan kamera setelah dapat
          cekSantriBayar(); // Cek saldo santri
        },
        (errorMessage) => { }
      ).catch((err) => {
        showToast('Gagal mengakses kamera.', 'error');
        toggleKameraBayar();
      });
    }

    // Update originalLoadMenu agar kamera bayar juga mati saat pindah menu
    const prevLoadMenuBayar = loadMenu;
    loadMenu = function(index, btnEl) {
       if(html5QrCodeBayar && html5QrCodeBayar.isScanning) {

       }
       prevLoadMenuBayar(index, btnEl);
    }
