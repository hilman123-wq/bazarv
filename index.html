<!DOCTYPE html>
<html lang="id">

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }

    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

<body class="bg-gray-50 text-gray-800 font-sans antialiased overflow-hidden">
  
  <div id="app"></div>
  <div id="modal-container"></div>
  
  <div id="loading-overlay" class="fixed inset-0 bg-white bg-opacity-80 flex flex-col items-center justify-center z-50 hidden transition-opacity duration-300">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-emerald-200 border-t-emerald-600 mb-4"></div>
    <p class="text-emerald-800 font-bold animate-pulse tracking-wide">Menghubungkan ke Server Kilat...</p>
  </div>

  <script>
    const AppState = { user: null, mySaldo: 0 };
    const AppCache = {};
    let supabaseClient = null;

    function formatFotoUrl(url, nama) {
        if(!url) return 'https://ui-avatars.com/api/?name=' + encodeURIComponent(nama || 'S') + '&background=e0f2fe&color=0369a1&size=150';
        if(url.startsWith('data:image')) return url;
        let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) { return 'https://drive.google.com/uc?export=view&id=' + match[1]; }
        return url;
    }

    function clearCache(tableName) {
      if (tableName) { delete AppCache[tableName]; } 
      else { for (let key in AppCache) delete AppCache[key]; }
    }

    document.addEventListener("DOMContentLoaded", function() {
      const supaUrl = localStorage.getItem('SUPA_URL');
      const supaKey = localStorage.getItem('SUPA_KEY');
      if(!supaUrl || !supaKey) { 
          renderSetupAPI(); 
      } else { 
          initSupabase(supaUrl, supaKey);
          renderLogin(); 
      }
    });

    function initSupabase(url, key) {
       supabaseClient = supabase.createClient(url, key);
    }

    function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

    function showToast(msg, type = 'info') {
      const toast = document.createElement('div');
      toast.className = 'fixed top-6 right-6 px-6 py-4 rounded-lg text-white shadow-xl z-[9999] transform transition-all translate-y-0 opacity-100 flex items-center ' + (type === 'error' ? 'bg-red-500' : 'bg-emerald-600');
      toast.innerHTML = '<span class="mr-2">' + (type === 'error' ? '❌' : '✅') + '</span> <span class="font-medium">' + msg + '</span>';
      document.body.appendChild(toast);
      setTimeout(function() {
        toast.classList.add('-translate-y-4', 'opacity-0');
        setTimeout(function() { toast.remove(); }, 300);
      }, 3500);
    }

    function openModal(title, contentHTML) {
      const container = document.getElementById('modal-container');
      container.innerHTML = `
        <div id="dynamic-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-sm flex items-center justify-center z-40 p-4 transition-opacity">
          <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg transform transition-all duration-300 scale-100">
            <div class="flex justify-between items-center px-6 py-4 border-b border-gray-100">
              <h3 class="text-xl font-bold text-gray-800">${title}</h3>
              <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition-colors font-bold text-xl leading-none">&times;</button>
            </div>
            <div class="p-6 max-h-[75vh] overflow-y-auto">${contentHTML}</div>
          </div>
        </div>
      `;
    }

    function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

    function confirmAction(message, callback) {
      const html = `
        <p class="mb-6 text-gray-600 text-lg">${message}</p>
        <div class="flex justify-end gap-3">
          <button onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition-colors">Batal</button>
          <button id="btn-confirm-ok" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-colors">Ya, Lanjutkan</button>
        </div>
      `;
      openModal('Konfirmasi Tindakan', html);
      document.getElementById('btn-confirm-ok').onclick = function() { closeModal(); callback(); };
    }

    // =========================================================
    // JANTUNG APLIKASI: MENGHUBUNGKAN KE SUPABASE SECARA LANGSUNG
    // =========================================================
    async function fetchAPI(action, payload = {}, silent = false) {
      if(!silent) showLoading();
      try {
        if (!supabaseClient) throw new Error("Server Supabase belum terhubung!");
        let res;
        
        switch(action) {
          case 'login':
            res = await supabaseClient.from('users').select('*').eq('username', payload.username).eq('password', payload.password).single();
            if(res.error || !res.data) throw new Error("Username atau Password salah!");
            if(!silent) hideLoading(); return res.data;

          case 'get_data':
            res = await supabaseClient.from(payload.table.toLowerCase()).select('*');
            if(res.error) throw res.error;
            let mapped = [];
            if(res.data) {
                mapped = res.data.map(function(r) {
                   if(r.waktu) {
                       let tgl = new Date(r.waktu).toLocaleString('id-ID');
                       r.tanggal = tgl; r.waktu = tgl;
                   }
                   return r;
                });
            }
            if(!silent) hideLoading(); return mapped;

          case 'save_santri':
            if(payload.is_new) {
                res = await supabaseClient.from('santri').insert([{
                    id_santri: payload.id_santri, nama: payload.nama, 
                    rayon: payload.rayon, saldo: parseInt(payload.saldo)||0, foto: payload.foto
                }]);
            } else {
                res = await supabaseClient.from('santri').update({
                    nama: payload.nama, rayon: payload.rayon, 
                    saldo: parseInt(payload.saldo)||0, foto: payload.foto
                }).eq('id_santri', payload.id_santri);
            }
            if(res.error) throw res.error;
            if(!silent) hideLoading(); return true;

          case 'delete_santri':
            res = await supabaseClient.from('santri').delete().eq('id_santri', payload.id);
            if(res.error) throw res.error;
            if(!silent) hideLoading(); return true;

          case 'save_pedagang':
            if(payload.is_new) {
                res = await supabaseClient.from('pedagang').insert([{
                    id_pedagang: payload.id_pedagang, nama: payload.nama, 
                    jualan: payload.jualan, saldo: parseInt(payload.saldo)||0, status_aktif: 'Aktif'
                }]);
                if(res.error) throw res.error;
                await supabaseClient.from('users').insert([{
                    username: payload.id_pedagang, password: '123456', 
                    role: 'pedagang', id_ref: payload.id_pedagang
                }]);
            } else {
                res = await supabaseClient.from('pedagang').update({
                    nama: payload.nama, jualan: payload.jualan, saldo: parseInt(payload.saldo)||0
                }).eq('id_pedagang', payload.id_pedagang);
                if(res.error) throw res.error;
            }
            if(!silent) hideLoading(); return true;

          case 'delete_pedagang':
            await supabaseClient.from('pedagang').delete().eq('id_pedagang', payload.id);
            await supabaseClient.from('users').delete().eq('username', payload.id);
            if(!silent) hideLoading(); return true;

          case 'set_jadwal':
            const allP = await supabaseClient.from('pedagang').select('id_pedagang');
            if(allP.data) {
                for(let i=0; i<allP.data.length; i++) {
                    let st = payload.active_ids.includes(allP.data[i].id_pedagang) ? 'Aktif' : 'Libur';
                    await supabaseClient.from('pedagang').update({status_aktif: st}).eq('id_pedagang', allP.data[i].id_pedagang);
                }
            }
            if(!silent) hideLoading(); return true;

          case 'topup':
            let cS = await supabaseClient.from('santri').select('saldo').eq('id_santri', payload.id_santri).single();
            if(!cS.data) throw new Error("Santri tidak ditemukan");
            await supabaseClient.from('santri').update({saldo: cS.data.saldo + parseInt(payload.nominal)}).eq('id_santri', payload.id_santri);
            await supabaseClient.from('topup').insert([{
                id_topup: "TP"+Date.now(), id_santri: payload.id_santri, 
                nominal: payload.nominal, struk: payload.struk, petugas: payload.petugas
            }]);
            if(!silent) hideLoading(); return true;

          case 'jajan':
            let stJ = await supabaseClient.from('santri').select('saldo').eq('id_santri', payload.id_santri).single();
            let pdJ = await supabaseClient.from('pedagang').select('saldo, status_aktif').eq('id_pedagang', payload.id_pedagang).single();
            if(!stJ.data) throw new Error("Santri tidak ditemukan");
            if(!pdJ.data) throw new Error("Akses Pedagang tidak sah");
            if(pdJ.data.status_aktif !== 'Aktif') throw new Error("Toko sedang Libur");
            if(stJ.data.saldo < parseInt(payload.nominal)) throw new Error("Saldo santri tidak mencukupi");
            
            await supabaseClient.from('santri').update({saldo: stJ.data.saldo - parseInt(payload.nominal)}).eq('id_santri', payload.id_santri);
            await supabaseClient.from('pedagang').update({saldo: pdJ.data.saldo + parseInt(payload.nominal)}).eq('id_pedagang', payload.id_pedagang);
            await supabaseClient.from('transaksi').insert([{
                id_trx: "TRX"+Date.now(), id_santri: payload.id_santri, 
                id_pedagang: payload.id_pedagang, nominal: payload.nominal
            }]);
            if(!silent) hideLoading(); return { sisa_saldo: stJ.data.saldo - parseInt(payload.nominal) };

          case 'ajukan_pencairan':
            let pdP = await supabaseClient.from('pedagang').select('saldo').eq('id_pedagang', payload.id_pedagang).single();
            if(!pdP.data || pdP.data.saldo < parseInt(payload.nominal)) throw new Error("Saldo toko tidak cukup");
            await supabaseClient.from('pedagang').update({saldo: pdP.data.saldo - parseInt(payload.nominal)}).eq('id_pedagang', payload.id_pedagang);
            await supabaseClient.from('pencairan').insert([{
                id_pencairan: "WD"+Date.now(), id_pedagang: payload.id_pedagang, nominal: payload.nominal
            }]);
            if(!silent) hideLoading(); return true;

          case 'approve_pencairan':
            await supabaseClient.from('pencairan').update({status: 'Selesai'}).eq('id_pencairan', payload.id_pencairan);
            if(!silent) hideLoading(); return true;

          case 'catat_setoran':
            await supabaseClient.from('setoran').insert([{
                id_setoran: "SET"+Date.now(), id_pedagang: payload.id_pedagang, 
                nama_pedagang: payload.nama_pedagang, jenis: payload.jenis, nominal: payload.nominal
            }]);
            if(!silent) hideLoading(); return true;

          case 'catat_kehadiran':
            let pdK = await supabaseClient.from('pedagang').select('nama').eq('id_pedagang', payload.id_pedagang).single();
            let nmP = pdK.data ? pdK.data.nama : 'Tidak Diketahui';
            await supabaseClient.from('kehadiran').insert([{
                id_pedagang: payload.id_pedagang, nama_pedagang: nmP
            }]);
            if(!silent) hideLoading(); return { message: "Hadir", nama: nmP };

          case 'bayar_kegiatan':
            let stK = await supabaseClient.from('santri').select('saldo, nama').eq('id_santri', payload.id_santri).single();
            if(!stK.data) throw new Error("Santri tidak ditemukan");
            if(stK.data.saldo < parseInt(payload.nominal)) throw new Error("Saldo tidak cukup");
            
            await supabaseClient.from('santri').update({saldo: stK.data.saldo - parseInt(payload.nominal)}).eq('id_santri', payload.id_santri);
            let idB = "BYR"+Date.now();
            await supabaseClient.from('pembayaran_kegiatan').insert([{
                id_trx: idB, id_santri: payload.id_santri, 
                kegiatan: payload.kegiatan, nominal: payload.nominal, petugas: payload.petugas
            }]);
            if(!silent) hideLoading(); return { id_trx: idB, sisa_saldo: stK.data.saldo - parseInt(payload.nominal), nama: stK.data.nama };

          case 'pencairan_kegiatan':
            await supabaseClient.from('pencairan_kegiatan').insert([{
                id_pencairan: "WDK"+Date.now(), kegiatan: payload.kegiatan, 
                nominal: payload.nominal, petugas: payload.petugas
            }]);
            if(!silent) hideLoading(); return true;

          default: throw new Error("Aksi "+action+" tidak tersedia");
        }
      } catch(e) {
        if(!silent) hideLoading();
        console.error(e);
        showToast(e.message || "Gagal terkoneksi ke Server Supabase", 'error');
        return null;
      }
    }

    async function getTableData(tableName, forceRefresh = false) {
      if (!forceRefresh && AppCache[tableName]) return AppCache[tableName];
      const data = await fetchAPI('get_data', {table: tableName}, true);
      if (data) AppCache[tableName] = data;
      return data;
    }

              <div class="flex items-center mb-6">
                <div class="bg-emerald-100 p-3 rounded-full mr-4 text-emerald-600 text-2xl">🚀</div>
                <h2 class="text-2xl font-bold text-gray-800">Koneksi Supabase</h2>
              </div>
              <p class="text-sm mb-6 text-gray-600 bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                Masukkan kunci rahasia <b>Supabase</b> Anda di bawah ini agar aplikasi berjalan sangat kilat.
              </p>
              <div class="space-y-4 mb-6">
                <div>
                  <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Project URL</label>
                  <input type="text" id="supa-url" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none focus:border-emerald-500" value="${savedURL}" placeholder="https://xxxxxx.supabase.co">
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-500 uppercase mb-1">API Key (anon public)</label>
                  <input type="password" id="supa-key" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none focus:border-emerald-500 font-mono text-sm" value="${savedKEY}" placeholder="eyJhbG...">
                </div>
              </div>
              <div class="flex gap-3">
                <button onclick="saveSupaConfig()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3.5 rounded-xl shadow-md transition-all">Hubungkan ke Supabase</button>
                ${savedURL ? '<button onclick="renderLogin()" class="px-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold p-3 rounded-lg">Batal</button>' : ''}
              </div>
           </div>
        </div>
      `;
    }

    function saveSupaConfig() {
      const url = document.getElementById('supa-url').value.trim();
      const key = document.getElementById('supa-key').value.trim();
      if(!url || !key) return showToast('Harap isi kedua kolom!', 'error');
      
      localStorage.setItem('SUPA_URL', url);
      localStorage.setItem('SUPA_KEY', key);
      
      initSupabase(url, key);
      showToast('Berhasil Tersambung ke Supabase! 🚀');
      renderLogin();
    }

             <div class="relative z-10">

                   <h2 class="text-3xl font-extrabold text-emerald-800">Uang Digital</h2>
                   <p class="text-gray-500 mt-2">Masuk ke Sistem</p>
                </div>
                <h3 class="text-2xl font-bold text-gray-800 mb-6 hidden md:block">Masuk ke Akun Anda</h3>
                
                <form onsubmit="event.preventDefault(); doLogin(); return false;" class="space-y-5">
                  <div>

                    <input type="text" id="val-u" class="w-full bg-gray-50 border border-gray-300 focus:border-emerald-500 p-3.5 rounded-xl outline-none" required placeholder="Masukkan username">

    async function doLogin() {
      const u = document.getElementById('val-u').value;
      const p = document.getElementById('val-p').value;
      const res = await fetchAPI('login', { username: u, password: p });
      if(res) {
        AppState.user = res;
        clearCache(); 
        showToast('Selamat datang, ' + res.username + '!');
        renderMainApp();
      }
    }

    function compressAndPreviewImage(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 250; const MAX_HEIGHT = 250;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7); 
                    document.getElementById('f-foto-preview').src = dataUrl;
                    document.getElementById('f-foto-base64').value = dataUrl;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    }

    async function refreshTabelAbsensi() {
      const data = await getTableData('Kehadiran', true);

        let html = '';
        for(let i=0; i<recentAbsen.length; i++) {
            let a = recentAbsen[i];
            let waktuAbsen = a.waktu || a.tanggal || '-';
            let jamSaja = waktuAbsen.toString().includes(',') ? waktuAbsen.toString().split(',')[1].trim() : waktuAbsen;
            html += '<tr class="hover:bg-gray-50">';
            html += '<td class="px-4 py-3 text-sm text-gray-500 font-mono">' + jamSaja + '</td>';
            html += '<td class="px-4 py-3 font-medium text-gray-900">' + (a.id_pedagang || '-') + '</td>';
            html += '<td class="px-4 py-3 font-semibold text-emerald-700">' + (a.nama_pedagang || '-') + '</td>';
            html += '<td class="px-4 py-3 text-center"><span class="bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded-full">Hadir</span></td>';
            html += '</tr>';
        }
        document.getElementById('tb-absensi').innerHTML = html;
      } else { 
          document.getElementById('tb-absensi').innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center text-gray-400">Belum ada data absensi.</td></tr>';

    async function submitAbsensi(scannedId) {
      let idInput = '';
      if(scannedId && typeof scannedId === 'string') { idInput = scannedId; }
      else { idInput = document.getElementById('a-id').value.trim().toUpperCase(); }
      
      if(!idInput) return showToast('Harap isi ID Pedagang!', 'error');
      const res = await fetchAPI('catat_kehadiran', { id_pedagang: idInput });
      if(res) { 
          showToast('Hadir: ' + (res.message || res.nama)); 
          if(typeof scannedId !== 'string') document.getElementById('a-id').value = ''; 
          refreshTabelAbsensi(); 
      }
    }

    let html5QrCodeAbsen = null;
    function toggleKameraAbsen() {
      const container = document.getElementById('reader-absen-container');
      const btnKamera = document.getElementById('btn-kamera-absen');
      if (html5QrCodeAbsen && html5QrCodeAbsen.isScanning) { stopKameraAbsen(); return; }
      
      container.classList.remove('hidden');
      btnKamera.innerHTML = '❌ Tutup Kamera Scanner';
      btnKamera.classList.replace('bg-emerald-50', 'bg-red-50');
      btnKamera.classList.replace('text-emerald-700', 'text-red-600');
      
      html5QrCodeAbsen = new Html5Qrcode("reader-absen");
      html5QrCodeAbsen.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
        function(decodedText) { document.getElementById('a-id').value = decodedText; stopKameraAbsen(); submitAbsensi(decodedText); },
        function(errorMessage) { }
      ).catch(function() { showToast('Gagal kamera.', 'error'); stopKameraAbsen(); });
    }

    function stopKameraAbsen() {
      if (html5QrCodeAbsen && html5QrCodeAbsen.isScanning) { html5QrCodeAbsen.stop().then(function() { html5QrCodeAbsen.clear(); }).catch(function(){}); }
      const container = document.getElementById('reader-absen-container');
      const btnKamera = document.getElementById('btn-kamera-absen');
      if(container) { container.classList.add('hidden'); btnKamera.innerHTML = '📷 Buka Kamera Scanner'; btnKamera.className = 'w-full bg-emerald-50 text-emerald-700 font-bold py-3 rounded-xl border border-emerald-200 mb-4'; }
    }

    async function cekPedagangSetoran() {
      const query = document.getElementById('s-id').value.trim();
      if(!query) return;
      const infoBox = document.getElementById('s-info-box');
      infoBox.classList.remove('hidden');
      infoBox.innerHTML = 'Mencari...';
      const data = await getTableData('Pedagang');
      if(data) {
        let p = null;
        for(let i=0; i<data.length; i++) {
            if(data[i].id_pedagang.toUpperCase() === query.toUpperCase() || data[i].nama.toLowerCase().includes(query.toLowerCase())) { p = data[i]; break; }
        }
        if(p) {
           document.getElementById('s-id').value = p.id_pedagang;
           document.getElementById('s-id').setAttribute('data-nama', p.nama);
           infoBox.className = 'mt-3 p-3 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800 font-bold';
           infoBox.innerHTML = '✅ ' + p.nama + ' (' + p.id_pedagang + ')';
        } else {
           infoBox.className = 'mt-3 p-3 rounded-xl border bg-red-50 border-red-200 text-red-600 font-bold';
           infoBox.innerHTML = '❌ Tidak ditemukan!';
        }
      }
    }

    async function submitSetoran() {
      const idInput = document.getElementById('s-id');
      const nama = idInput.getAttribute('data-nama');
      const jenis = document.getElementById('s-jenis').value;
      const nom = document.getElementById('s-nom').value;
      if(!idInput.value || !nama) return showToast('Cari pedagang dulu', 'error');
      if(!nom || nom <= 0) return showToast('Nominal tidak valid', 'error');
      const res = await fetchAPI('catat_setoran', { id_pedagang: idInput.value, nama_pedagang: nama, jenis: jenis, nominal: nom });
      if(res) { clearCache('Setoran'); showToast('Setoran dicatat!'); renderSetoran(); }
    }

    window.exportLaporanCSV = function() {
        const setoranData = AppCache['Setoran'];
        if(!setoranData || setoranData.length === 0) return showToast('Kosong', 'error');
        const rekap = {}; let tS = 0, tW = 0;
        setoranData.forEach(function(s) {
            if(!rekap[s.id_pedagang]) rekap[s.id_pedagang] = { nama: s.nama_pedagang, shodaqoh: 0, sewa: 0 };
            let nom = parseInt(s.nominal||0);
            if(s.jenis === 'Shodaqoh') { rekap[s.id_pedagang].shodaqoh += nom; tS += nom; }
            if(s.jenis === 'Sewa Tenda') { rekap[s.id_pedagang].sewa += nom; tW += nom; }
        });
        let csv = "ID Pedagang;Nama Pedagang;Total Shodaqoh;Total Sewa Tenda;Grand Total\n";
        for (const id in rekap) {
            let d = rekap[id];
            csv += id + ';' + d.nama + ';' + d.shodaqoh + ';' + d.sewa + ';' + (d.shodaqoh+d.sewa) + '\n';
        }
        csv += '\nTOTAL KESELURUHAN;;' + tS + ';' + tW + ';' + (tS + tW) + '\n';
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = 'Rekap_Bazar.csv'; link.click();
    };

    async function submitPencairanKegiatan() {
       const keg = document.getElementById('wdk-kegiatan').value;
       const nom = parseInt(document.getElementById('wdk-nom').value);
       if(!keg) return showToast('Pilih kas kegiatan terlebih dahulu', 'error');
       if(!nom || nom <= 0) return showToast('Nominal tidak valid', 'error');

       confirmAction('Tarik dana <b>Rp ' + nom.toLocaleString('id-ID') + '</b> dari kas <b>' + keg + '</b>?', async function() {
          const res = await fetchAPI('pencairan_kegiatan', { kegiatan: keg, nominal: nom, petugas: AppState.user.username });
          if(res) { clearCache('Pencairan_Kegiatan'); showToast('Dana berhasil dicairkan!'); renderPencairanKegiatan(); }
       });
    }

               <div class="mb-6"><label class="block font-bold mb-2">Nominal Pencairan</label><input type="number" id="w-nom" class="w-full border-2 p-4 rounded-xl text-lg font-bold" placeholder="0"><button onclick="document.getElementById('w-nom').value = AppState.mySaldo" class="mt-2 text-xs text-blue-600 font-medium">Tarik Semua Saldo</button></div>
               <button onclick="submitWD()" class="w-full bg-orange-500 text-white font-bold py-4 rounded-xl">Kirim Pengajuan</button>
            </div>
            <div>
              <h3 class="text-lg font-bold mb-4 border-l-4 border-orange-500 pl-3">Riwayat Pengajuan</h3>
              <div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-left whitespace-nowrap text-sm"><thead class="bg-gray-50 border-b text-xs font-bold"><tr><th class="px-4 py-3">Waktu</th><th class="px-4 py-3">Nominal (Rp)</th><th class="px-4 py-3 text-center">Status</th></tr></thead><tbody id="tb-mywd" class="divide-y"><tr><td colspan="3" class="px-4 py-6 text-center">Memuat...</td></tr></tbody></table></div>
            </div>
          </div>
        </div>
      `;
      const [pData, wData] = await Promise.all([ getTableData('Pedagang'), getTableData('Pencairan') ]);
      if(pData) { 
          let me = null;
          for(let i=0; i<pData.length; i++) { if(pData[i].id_pedagang === AppState.user.id_ref) { me = pData[i]; break; } }
          if(me) { AppState.mySaldo = parseInt(me.saldo||0); document.getElementById('wd-saldo').innerText = 'Rp ' + AppState.mySaldo.toLocaleString('id-ID'); } 
      }
      
      if(wData) {
        let myWds = [];
        for(let i=0; i<wData.length; i++) { if(wData[i].id_pedagang === AppState.user.id_ref) myWds.push(wData[i]); }
        myWds = myWds.reverse();
        
        let wdHTML = '';
        for(let j=0; j<myWds.length; j++) {
            let w = myWds[j];
            let badge = w.status === 'Pending' ? '<span class="px-2 py-1 text-[10px] font-bold rounded-full bg-orange-100 text-orange-700">' + w.status + '</span>' : '<span class="px-2 py-1 text-[10px] font-bold rounded-full bg-green-100 text-green-700">' + w.status + '</span>';
            wdHTML += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 text-gray-600">' + w.tanggal + '</td><td class="px-4 py-3 font-mono font-bold">Rp ' + parseInt(w.nominal||0).toLocaleString('id-ID') + '</td><td class="px-4 py-3 text-center">' + badge + '</td></tr>';
        }
        document.getElementById('tb-mywd').innerHTML = wdHTML || '<tr><td colspan="3" class="px-4 py-8 text-center text-gray-400">Belum ada data.</td></tr>';
      }
    }

    async function submitWD() {
      const n = parseInt(document.getElementById('w-nom').value);
      if(!n || n <= 0 || n > AppState.mySaldo) return showToast('Nominal salah atau melebihi saldo', 'error');
      
      confirmAction('Ajukan pencairan <b>Rp ' + n.toLocaleString('id-ID') + '</b>?', async function() {
        const res = await fetchAPI('ajukan_pencairan', { id_pedagang: AppState.user.id_ref, nominal: n });
        if(res) { clearCache('Pedagang'); clearCache('Pencairan'); showToast('Berhasil diajukan!'); renderAjukanWD(); }
      });
    }

    // ==========================================
    // REFRESH DATA (SEGARKAN)
    // ==========================================
    window.refreshAppData = async function() {
        document.getElementById('loading-overlay').classList.remove('hidden');
        clearCache();
        const activeBtn = document.querySelector('.menu-btn.bg-gray-800');
        if (activeBtn) activeBtn.click();
        else if (AppState.user.role === 'pedagang') renderDashboardPedagang();
        else RoleMenus[AppState.user.role][0].action();
        setTimeout(function() { document.getElementById('loading-overlay').classList.add('hidden'); showToast('Data berhasil disinkronkan kilat! ⚡'); }, 800);
    };

  </script>
</body>
</html>
