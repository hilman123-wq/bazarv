    function formatFotoUrl(url, nama) {
        if(!url) return 'https://ui-avatars.com/api/?name=' + encodeURIComponent(nama || 'S') + '&background=e0f2fe&color=0369a1&size=150';
        if(url.startsWith('data:image')) return url;
        let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) { return 'https://drive.google.com/uc?export=view&id=' + match[1]; }
        return url;
    }

    function initSupabase(url, key) {

    function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

    function showToast(msg, type = 'info') {
      const toast = document.createElement('div');
      toast.className = 'fixed top-6 right-6 px-6 py-4 rounded-lg text-white shadow-xl z-[9999] transform transition-all translate-y-0 opacity-100 flex items-center ' + (type === 'error' ? 'bg-red-500' : 'bg-emerald-600');
      toast.innerHTML = '<span class="mr-2">' + (type === 'error' ? '❌' : '✅') + '</span> <span class="font-medium">' + msg + '</span>';
      document.body.appendChild(toast);
      setTimeout(function() {
        toast.classList.add('-translate-y-4', 'opacity-0');
        setTimeout(function() { toast.remove(); }, 300);
      }, 3500);
    }

    function openModal(title, contentHTML) {
      const container = document.getElementById('modal-container');
      container.innerHTML = `
        <div id="dynamic-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-sm flex items-center justify-center z-40 p-4 transition-opacity">

            </div>
            <div class="p-6 max-h-[75vh] overflow-y-auto">${contentHTML}</div>
          </div>
        </div>
      `;
    }

    function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

    function confirmAction(message, callback) {
      const html = `
        <p class="mb-6 text-gray-600 text-lg">${message}</p>
        <div class="flex justify-end gap-3">
          <button onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition-colors">Batal</button>
          <button id="btn-confirm-ok" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-colors">Ya, Lanjutkan</button>
        </div>
      `;
      openModal('Konfirmasi Tindakan', html);
      document.getElementById('btn-confirm-ok').onclick = function() { closeModal(); callback(); };
    }

    // =========================================================
    // JANTUNG APLIKASI: MENGHUBUNGKAN KE SUPABASE SECARA LANGSUNG
    // =========================================================
    async function fetchAPI(action, payload = {}, silent = false) {
      if(!silent) showLoading();
      try {
        if (!supabaseClient) throw new Error("Server Supabase belum terhubung!");
        let res;
        
        switch(action) {
          case 'login':
             res = await supabaseClient.from('users').select('*').eq('username', payload.username).eq('password', payload.password);
             if(res.error) throw new Error("Error Database: " + res.error.message);
             if(!res.data || res.data.length === 0) throw new Error("Username atau Password salah!");
             if(!silent) hideLoading(); 
             return res.data[0];

          case 'get_data':
            res = await supabaseClient.from(payload.table.toLowerCase()).select('*');
            if(res.error) throw res.error;
            let mapped = [];
            if(res.data) {
                mapped = res.data.map(function(r) {
                   if(r.waktu || r.tanggal) {
                       // PERBAIKAN: Mengubah 's' menjadi 'r'
                       let tgl = r.waktu || r.tanggal || '-';
                       r.tanggal = tgl; r.waktu = tgl;
                   }
                   return r;
                });
            }
            if(!silent) hideLoading(); return mapped;

           case 'catat_kehadiran':
            let myRef = String(AppState.user.id_ref || '').trim().toUpperCase();
            let myUser = String(AppState.user.username || '').trim().toUpperCase();
            
            let idAsli = '';

            // 1. Cek Cepat di Ingatan Lokal (Paling Akurat karena Dasbor Anda sudah terbuka)
            if (typeof AppCache !== 'undefined' && AppCache['Pedagang']) {
                let pdg = AppCache['Pedagang'].find(p => 
                    String(p.id_pedagang).toUpperCase() === myRef || 
                    String(p.id_pedagang).toUpperCase() === myUser
                );
                if (pdg) idAsli = pdg.id_pedagang;
            }

            // 2. Jika di ingatan tidak ada, paksakan cari langsung ke Database Supabase
            if (!idAsli) {
                let { data: cekPdg } = await supabaseClient.from('pedagang').select('id_pedagang');
                if (cekPdg) {
                    let pdgDb = cekPdg.find(p => 
                        String(p.id_pedagang).toUpperCase() === myRef || 
                        String(p.id_pedagang).toUpperCase() === myUser
                    );
                    if (pdgDb) idAsli = pdgDb.id_pedagang;
                }
            }

            // 3. PENGAMAN UTAMA: Jika tetap tidak ketemu, BATALKAN proses sebelum terjadi error 409
            if (!idAsli) {
                throw new Error(`Data akun Anda (${myUser}/${myRef}) tidak cocok dengan Master Pedagang. Lapor ke Admin!`);
            }

            // 4. Eksekusi dengan ID yang sudah 100% PASTI ADA di tabel pedagang
            let resHadir;
            if (Array.isArray(payload)) {
                payload.forEach(p => p.id_pedagang = idAsli);
                resHadir = await supabaseClient.from('kehadiran').insert(payload);
            } else {
                payload.id_pedagang = idAsli;
                if(!payload.waktu && !payload.tanggal) {
                    payload.waktu = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });
                }
                resHadir = await supabaseClient.from('kehadiran').insert([payload]);
            }
            
            if (resHadir?.error) throw new Error("Gagal mencatat kehadiran: " + resHadir.error.message);
            if (!silent) hideLoading(); 
            return true;

          case 'save_santri':
            if(payload.is_new) {
                res = await supabaseClient.from('santri').insert([{
                    id_santri: payload.id_santri, nama: payload.nama, 
                    rayon: payload.rayon, saldo: parseInt(payload.saldo)||0, foto: payload.foto
                }]);
            } else {
                res = await supabaseClient.from('santri').update({
                    nama: payload.nama, rayon: payload.rayon, 
                    saldo: parseInt(payload.saldo)||0, foto: payload.foto
                }).eq('id_santri', payload.id_santri);
            }
            if(res.error) throw res.error;
            if(!silent) hideLoading(); return true;

          case 'delete_santri':
            res = await supabaseClient.from('santri').delete().eq('id_santri', payload.id);
            if(res.error) throw res.error;
            if(!silent) hideLoading(); return true;

          case 'save_pedagang':
            if(payload.is_new) {
                res = await supabaseClient.from('pedagang').insert([{
                    id_pedagang: payload.id_pedagang, nama: payload.nama, 
                    jualan: payload.jualan, saldo: parseInt(payload.saldo)||0, status_aktif: 'Aktif'
                }]);
                if(res.error) throw res.error;
                await supabaseClient.from('users').insert([{
                    username: payload.id_pedagang, password: '123456', 
                    role: 'pedagang', id_ref: payload.id_pedagang
                }]);
            } else {
                res = await supabaseClient.from('pedagang').update({
                    nama: payload.nama, jualan: payload.jualan, saldo: parseInt(payload.saldo)||0
                }).eq('id_pedagang', payload.id_pedagang);
                if(res.error) throw res.error;
            }
            if(!silent) hideLoading(); return true;

          case 'delete_pedagang':
            await supabaseClient.from('pedagang').delete().eq('id_pedagang', payload.id);
            await supabaseClient.from('users').delete().eq('username', payload.id);
            if(!silent) hideLoading(); return true;

          case 'set_jadwal':
            const allP = await supabaseClient.from('pedagang').select('id_pedagang');
            if(allP.data) {
                for(let i=0; i<allP.data.length; i++) {
                    let st = payload.active_ids.includes(allP.data[i].id_pedagang) ? 'Aktif' : 'Libur';
                    await supabaseClient.from('pedagang').update({status_aktif: st}).eq('id_pedagang', allP.data[i].id_pedagang);
                }
            }
            if(!silent) hideLoading(); return true;

          case 'topup':
            let cS = await supabaseClient.from('santri').select('saldo').eq('id_santri', payload.id_santri).single();
            if(!cS.data) throw new Error("Santri tidak ditemukan");
            
            let resUp = await supabaseClient.from('santri').update({saldo: cS.data.saldo + parseInt(payload.nominal)}).eq('id_santri', payload.id_santri);
            if(resUp.error) throw new Error("Gagal update saldo santri: " + resUp.error.message);

            let resIn = await supabaseClient.from('topup').insert([{ 
                id_topup: "TP" + Date.now(),
                id_santri: payload.id_santri, 
                nominal: parseInt(payload.nominal), 
                waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
                metode: payload.metode || 'Cash',
                struk: payload.struk || '-',
                petugas: payload.petugas || 'Admin'
            }]);
            if(resIn.error) throw new Error("Gagal menyimpan riwayat: " + resIn.error.message);
            if(!silent) hideLoading(); return true;

          case 'jajan':
            let stJ = await supabaseClient.from('santri').select('saldo').eq('id_santri', payload.id_santri).single();
            let pdJ = await supabaseClient.from('pedagang').select('saldo, status_aktif').eq('id_pedagang', payload.id_pedagang).single();
            if(!stJ.data) throw new Error("Santri tidak ditemukan");
            if(!pdJ.data) throw new Error("Akses Pedagang tidak sah");
            if(pdJ.data.status_aktif !== 'Aktif') throw new Error("Toko sedang Libur");
            if(stJ.data.saldo < parseInt(payload.nominal)) throw new Error("Saldo santri tidak mencukupi");
            
            // 1. Potong saldo santri & tambah saldo pedagang
            await supabaseClient.from('santri').update({saldo: stJ.data.saldo - parseInt(payload.nominal)}).eq('id_santri', payload.id_santri);
            await supabaseClient.from('pedagang').update({saldo: pdJ.data.saldo + parseInt(payload.nominal)}).eq('id_pedagang', payload.id_pedagang);
            
            // 2. Simpan Riwayat Jajan (DENGAN ALARM ERROR)
            let resTrx = await supabaseClient.from('transaksi').insert([{
                id_trx: "TRX"+Date.now(), id_santri: payload.id_santri, 
                id_pedagang: payload.id_pedagang, nominal: payload.nominal,
                waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' })
            }]);
            
            // Jika database menolak, aplikasi akan memunculkan layar merah
            if(resTrx.error) throw new Error("Gagal menyimpan riwayat jajan: " + resTrx.error.message);
            
            if(!silent) hideLoading(); return { sisa_saldo: stJ.data.saldo - parseInt(payload.nominal) };
          
          case 'jajan_tunai':
            // Mengambil status toko tanpa .single() untuk menghindari Error 406
            let pdJCash = await supabaseClient.from('pedagang').select('status_aktif').eq('id_pedagang', payload.id_pedagang);
            
            // Cek apakah data kosong
            if(!pdJCash.data || pdJCash.data.length === 0) throw new Error("Akses Pedagang tidak sah (" + payload.id_pedagang + ")");
            if(pdJCash.data[0].status_aktif !== 'Aktif') throw new Error("Toko sedang Libur");
            
            // HANYA MENCATAT RIWAYAT (AGAR TERBACA SEBAGAI OMZET)
            let resTrxCash = await supabaseClient.from('transaksi').insert([{
                id_trx: "CASH" + Date.now(), 
                id_santri: "UMUM (TUNAI)", 
                id_pedagang: payload.id_pedagang, 
                nominal: payload.nominal,
                waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' })
            }]);
            
            if(resTrxCash.error) throw new Error("Gagal mencatat transaksi tunai: " + resTrxCash.error.message);
            if(!silent) hideLoading(); return true;

          case 'ajukan_pencairan':
            let pdP = await supabaseClient.from('pedagang').select('saldo').eq('id_pedagang', payload.id_pedagang).single();
            if(!pdP.data || pdP.data.saldo < parseInt(payload.nominal)) throw new Error("Saldo toko tidak cukup");
            await supabaseClient.from('pedagang').update({saldo: pdP.data.saldo - parseInt(payload.nominal)}).eq('id_pedagang', payload.id_pedagang);
            await supabaseClient.from('pencairan').insert([{
                id_pencairan: "WD"+Date.now(), id_pedagang: payload.id_pedagang, nominal: payload.nominal
            }]);
            if(!silent) hideLoading(); return true;

          case 'approve_pencairan':
            await supabaseClient.from('pencairan').update({status: 'Selesai'}).eq('id_pencairan', payload.id_pencairan);
            if(!silent) hideLoading(); return true;

          case 'catat_setoran':
            // 1. Simpan ke Laporan Setoran Pedagang
            let resSetoran = await supabaseClient.from('setoran').insert([{
                id_setoran: "SET" + Date.now(), 
                id_pedagang: payload.id_pedagang, 
                nama_pedagang: payload.nama_pedagang, 
                jenis: payload.jenis, 
                nominal: payload.nominal,
                waktu: payload.waktu
            }]);
            if(resSetoran.error) throw new Error("Setoran gagal disimpan: " + resSetoran.error.message);

            // 2. Otomatis masuk Debit ke Buku Kas Operasional (Rute Baru yang Benar)
            let resKas = await supabaseClient.from('cashflow').insert([{
                tanggal: payload.waktu,
                jenis: 'Debit',
                deskripsi: "Setoran " + payload.jenis + " dari " + payload.nama_pedagang + " (" + payload.id_pedagang + ")",
                nominal: parseInt(payload.nominal)
            }]);
            if(resKas.error) throw new Error("Buku kas gagal diperbarui: " + resKas.error.message);
            
            if(!silent) hideLoading(); return true;

          case 'bayar_kegiatan':
            let stK = await supabaseClient.from('santri').select('saldo, nama').eq('id_santri', payload.id_santri).single();
            if(!stK.data) throw new Error("Santri tidak ditemukan");
            if(stK.data.saldo < parseInt(payload.nominal)) throw new Error("Saldo tidak cukup");
            
            await supabaseClient.from('santri').update({saldo: stK.data.saldo - parseInt(payload.nominal)}).eq('id_santri', payload.id_santri);
            let idB = "BYR"+Date.now();
            await supabaseClient.from('pembayaran_kegiatan').insert([{
                id_trx: idB, id_santri: payload.id_santri, 
                kegiatan: payload.kegiatan, nominal: payload.nominal, petugas: payload.petugas
            }]);
            if(!silent) hideLoading(); return { id_trx: idB, sisa_saldo: stK.data.saldo - parseInt(payload.nominal), nama: stK.data.nama };

          case 'pencairan_kegiatan':
            await supabaseClient.from('pencairan_kegiatan').insert([{
                id_pencairan: "WDK"+Date.now(), kegiatan: payload.kegiatan, 
                nominal: payload.nominal, petugas: payload.petugas
            }]);
            if(!silent) hideLoading(); return true;

          default: throw new Error("Aksi "+action+" tidak tersedia");
        }
      } catch(e) {
        if(!silent) hideLoading();
        console.error(e);
        showToast(e.message || "Gagal terkoneksi ke Server Supabase", 'error');
        return null;
      }
    }

    async function getTableData(tableName, forceRefresh = false) {
      if (!forceRefresh && AppCache[tableName]) return AppCache[tableName];
      const data = await fetchAPI('get_data', {table: tableName}, true);
      if (data) AppCache[tableName] = data;
      return data;
    }

    async function doLogin() {
      const u = document.getElementById('val-u').value;

      let antreanPencairan = 0; let totalSelesaiPencairan = 0;
      if(wd) { wd.forEach(function(w) { if(w.status === 'Pending') antreanPencairan++; if(w.status === 'Selesai') totalSelesaiPencairan += parseInt(w.nominal||0); }); }
      let totalSemuaSetoran = 0; if(setoran) setoran.forEach(function(s) { totalSemuaSetoran += parseInt(s.nominal||0); });

    function compressAndPreviewImage(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 250; const MAX_HEIGHT = 250;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7); 
                    document.getElementById('f-foto-preview').src = dataUrl;
                    document.getElementById('f-foto-base64').value = dataUrl;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    }

              } else {
                  mapDigital[pId] = (mapDigital[pId] || 0) + nom;
              }
          });
      }

      if (pencairanData && pencairanData.length > 0) {
          pencairanData.forEach(p => {
              let pId = p.id_pedagang;
              let nom = parseInt(p.nominal || 0);
              mapTarik[pId] = (mapTarik[pId] || 0) + nom;

    let html5QrCodeAbsen = null;
    function toggleKameraAbsen() {
      const container = document.getElementById('reader-absen-container');
      const btnKamera = document.getElementById('btn-kamera-absen');
      if (html5QrCodeAbsen && html5QrCodeAbsen.isScanning) { stopKameraAbsen(); return; }
      
      container.classList.remove('hidden');
      btnKamera.innerHTML = '❌ Tutup Kamera Scanner';
      btnKamera.classList.replace('bg-emerald-50', 'bg-red-50');
      btnKamera.classList.replace('text-emerald-700', 'text-red-600');
      
      html5QrCodeAbsen = new Html5Qrcode("reader-absen");
      html5QrCodeAbsen.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
        function(decodedText) { document.getElementById('a-id').value = decodedText; stopKameraAbsen(); submitAbsensi(decodedText); },
        function(errorMessage) { }
      ).catch(function() { showToast('Gagal kamera.', 'error'); stopKameraAbsen(); });
    }

    function stopKameraAbsen() {
      if (html5QrCodeAbsen && html5QrCodeAbsen.isScanning) { html5QrCodeAbsen.stop().then(function() { html5QrCodeAbsen.clear(); }).catch(function(){}); }
      const container = document.getElementById('reader-absen-container');
      const btnKamera = document.getElementById('btn-kamera-absen');
      if(container) { container.classList.add('hidden'); btnKamera.innerHTML = '📷 Buka Kamera Scanner'; btnKamera.className = 'w-full bg-emerald-50 text-emerald-700 font-bold py-3 rounded-xl border border-emerald-200 mb-4'; }

    async function cekPedagangSetoran() {
      const query = document.getElementById('s-id').value.trim();
      if(!query) return;
      const infoBox = document.getElementById('s-info-box');
      infoBox.classList.remove('hidden');
      infoBox.innerHTML = 'Mencari...';
      const data = await getTableData('Pedagang');
      if(data) {
        let p = null;
        for(let i=0; i<data.length; i++) {
            if(data[i].id_pedagang.toUpperCase() === query.toUpperCase() || data[i].nama.toLowerCase().includes(query.toLowerCase())) { p = data[i]; break; }
        }
        if(p) {
           document.getElementById('s-id').value = p.id_pedagang;
           document.getElementById('s-id').setAttribute('data-nama', p.nama);
           infoBox.className = 'mt-3 p-3 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800 font-bold';
           infoBox.innerHTML = '✅ ' + p.nama + ' (' + p.id_pedagang + ')';
        } else {
           infoBox.className = 'mt-3 p-3 rounded-xl border bg-red-50 border-red-200 text-red-600 font-bold';
           infoBox.innerHTML = '❌ Tidak ditemukan!';
        }
      }
    }

    async function submitSetoran() {
      const idInput = document.getElementById('s-id');
      const nama = idInput.getAttribute('data-nama');
      const jenis = document.getElementById('s-jenis').value;
      const nom = document.getElementById('s-nom').value;
      const tglInput = document.getElementById('s-tanggal').value; // Tangkap tanggal dari kalender

      if(!idInput.value || !nama) return showToast('Cari pedagang dulu', 'error');
      if(!nom || nom <= 0) return showToast('Nominal tidak valid', 'error');
      if(!tglInput) return showToast('Tanggal tidak boleh kosong', 'error');
      
      // Mengubah format YYYY-MM-DD dari kalender menjadi format DD/MM/YYYY
      const [yy, mm, dd] = tglInput.split('-');

    window.exportLaporanCSV = function() {
        const setoranData = AppCache['Setoran'];
        if(!setoranData || setoranData.length === 0) return showToast('Kosong', 'error');
        const rekap = {}; let tS = 0, tW = 0;
        setoranData.forEach(function(s) {
            if(!rekap[s.id_pedagang]) rekap[s.id_pedagang] = { nama: s.nama_pedagang, shodaqoh: 0, sewa: 0 };
            let nom = parseInt(s.nominal||0);
            if(s.jenis === 'Shodaqoh') { rekap[s.id_pedagang].shodaqoh += nom; tS += nom; }
            if(s.jenis === 'Sewa Tenda') { rekap[s.id_pedagang].sewa += nom; tW += nom; }
        });
        let csv = "ID Pedagang;Nama Pedagang;Total Shodaqoh;Total Sewa Tenda;Grand Total\n";
        for (const id in rekap) {
            let d = rekap[id];
            csv += id + ';' + d.nama + ';' + d.shodaqoh + ';' + d.sewa + ';' + (d.shodaqoh+d.sewa) + '\n';
        }
        csv += '\nTOTAL KESELURUHAN;;' + tS + ';' + tW + ';' + (tS + tW) + '\n';
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = 'Rekap_Bazar.csv'; link.click();
    };

    window.exportLaporanKegiatanCSV = function() {
        const kData = AppCache['Pembayaran_Kegiatan']; 
        const sData = AppCache['Santri'];
        if(!kData || kData.length === 0) return showToast('Kosong', 'error');
        const mapS = {}; if(sData) sData.forEach(function(s) { mapS[s.id_santri] = s.nama; });
        
        let csv = "ID Transaksi;Waktu;ID Santri;Nama Santri;Jenis Kegiatan;Nominal Potongan;Petugas\n";
        let tot = 0;
        let reverseData = [].concat(kData).reverse();
        for(let i=0; i<reverseData.length; i++) { 
            let t = reverseData[i];
            const nom = parseInt(t.nominal||0); tot += nom; 
            csv += (t.id_trx||'-') + ';' + (t.waktu||t.tanggal||'-') + ';' + t.id_santri + ';' + (mapS[t.id_santri]||'-') + ';' + t.kegiatan + ';' + nom + ';' + (t.petugas||'-') + '\n'; 
        }
        csv += '\nTOTAL;;;;;' + tot + ';\n';
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = 'Laporan_Kegiatan.csv'; link.click();
    };

    async function cekSantriPedagang() {
      const q = document.getElementById('j-id').value.trim(); if(!q) return;
      const b = document.getElementById('j-info-box'); b.classList.remove('hidden'); b.innerHTML = '<div class="text-center p-4 font-bold text-gray-500">Mencari Data...</div>';
      const d = await getTableData('Santri');
      if(d) {
        let s = null;
        for(let i=0; i<d.length; i++) {
           if(d[i].id_santri.toUpperCase() === q.toUpperCase() || d[i].nama.toLowerCase().includes(q.toLowerCase())) { s = d[i]; break; }
        }
        if(s) {
           document.getElementById('j-id').value = s.id_santri;
           b.className = 'mt-4 p-6 rounded-3xl border-2 bg-gradient-to-b from-green-50 to-emerald-100 border-emerald-300 shadow-lg text-center transition-all';
           let imgUrl = formatFotoUrl(s.foto, s.nama);

           document.getElementById('j-nom').focus();
        } else { 
           b.className = 'mt-4 p-5 rounded-2xl border-2 bg-red-50 border-red-200 text-center'; 
           b.innerHTML = '<div class="text-red-600 font-bold text-xl">❌ Santri tidak ditemukan!</div>'; 
        }
      }
    }

    let html5QrCode = null;
    function toggleKamera() {
      const con = document.getElementById('reader-container'); const btn = document.getElementById('btn-kamera');
      if (html5QrCode && html5QrCode.isScanning) { stopKamera(); return; }
      con.classList.remove('hidden'); btn.innerHTML = '❌ Tutup Kamera'; btn.className = 'w-full bg-red-50 text-red-600 font-bold py-3 rounded-xl border border-red-200';
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, function(txt) { 
          document.getElementById('j-id').value = txt; 
          try{navigator.vibrate(200);}catch(e){} 
          stopKamera(); 
          cekSantriPedagang(); // INI KUNCI AGAR DATA LANGSUNG MUNCUL
      }, function(err) {}).catch(function(e) { stopKamera(); });
    }

    function stopKamera() {
      if (html5QrCode && html5QrCode.isScanning) { html5QrCode.stop().then(function(){html5QrCode.clear();}).catch(function(e){}); }
      const con = document.getElementById('reader-container'); const btn = document.getElementById('btn-kamera');
      if(con) { con.classList.add('hidden'); btn.innerHTML = '📷 Buka Scanner QR'; btn.className = 'w-full bg-indigo-50 text-indigo-700 font-bold py-3 rounded-xl border border-indigo-200'; }
    }

    // ==========================================
    // DASHBOARD VIEWER (PEMANTAUAN BAZAR - FILTER WAKTU)
    // ==========================================
    async function renderDashboardViewer(filterPeriode = 'hari_ini') {
      document.getElementById('main-content').innerHTML = '<div class="flex justify-center items-center h-64"><div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-200 border-t-blue-600"></div></div>';

      const [pdgData, trxData, setoranData] = await Promise.all([
          getTableData('Pedagang'), getTableData('Transaksi'), getTableData('Setoran')
      ]);

      const mapPdg = {};
      const rekap = {};

      // 1. Ambil data dasar Pedagang (Termasuk SALDO SAAT INI)
      if(pdgData) {
          pdgData.forEach(p => {
             mapPdg[p.id_pedagang] = p.nama;
             rekap[p.id_pedagang] = { 
                 nama: p.nama, 
                 saldo: parseInt(p.saldo || 0), 
                 omzet: 0, 
                 shodaqoh: 0, 
                 sewa: 0 
             };
          });
      }

      // Mesin Pengecek Waktu
      let today = new Date();
      today.setHours(0,0,0,0); 

      function cekPeriode(strWaktu) {
          if(filterPeriode === 'semua') return true;
          if(!strWaktu || strWaktu === '-') return false;
          
          let dateStr = strWaktu.split(',')[0].trim();
          let trxDate;
          
          if (dateStr.includes('/')) {
              let p = dateStr.split('/');
              if(p.length === 3) trxDate = new Date(p[2], p[1]-1, p[0]); 
          } else if (dateStr.includes('-')) {
              let p = dateStr.split('-');
              if(p.length === 3) trxDate = new Date(p[0], p[1]-1, p[2]); 
          }
          
          if (!trxDate || trxDate.toString() === 'Invalid Date') return false;

          if(filterPeriode === 'hari_ini') return trxDate.getTime() === today.getTime();
          if(filterPeriode === 'pekan_ini') {
              let diff = (today.getTime() - trxDate.getTime()) / (1000 * 3600 * 24);
              return diff >= 0 && diff <= 7;
          }
          if(filterPeriode === 'bulan_ini') return trxDate.getMonth() === today.getMonth() && trxDate.getFullYear() === today.getFullYear();
          if(filterPeriode === 'tahun_ini') return trxDate.getFullYear() === today.getFullYear();
          return true;
      }

      // 2. Kalkulasi Omzet Jajan sesuai filter
      if(trxData) {
         trxData.forEach(t => {
             if(cekPeriode(t.waktu || t.tanggal)) {
                 if(!rekap[t.id_pedagang]) rekap[t.id_pedagang] = { nama: mapPdg[t.id_pedagang] || t.id_pedagang, saldo: 0, omzet: 0, shodaqoh: 0, sewa: 0 };
                 rekap[t.id_pedagang].omzet += parseInt(t.nominal || 0);
             }
         });
      }

      // 3. Kalkulasi Setoran sesuai filter
      if(setoranData) {
         setoranData.forEach(s => {
             if(cekPeriode(s.waktu || s.tanggal)) {
                 if(!rekap[s.id_pedagang]) rekap[s.id_pedagang] = { nama: mapPdg[s.id_pedagang] || s.nama_pedagang, saldo: 0, omzet: 0, shodaqoh: 0, sewa: 0 };
                 const nom = parseInt(s.nominal || 0);
                 if(s.jenis === 'Shodaqoh') rekap[s.id_pedagang].shodaqoh += nom;
                 if(s.jenis === 'Sewa Tenda') rekap[s.id_pedagang].sewa += nom;
             }
         });
      }

      let rHtml = '';
      let totOmzet = 0, totShodaqoh = 0, totSewa = 0, totSaldoDigital = 0;

      // 4. Susun Baris Tabel
      for (const id in rekap) {
         let d = rekap[id];
         totOmzet += d.omzet;
         totShodaqoh += d.shodaqoh;
         totSewa += d.sewa;
         totSaldoDigital += d.saldo; // Penjumlahan untuk Total Saldo Digital

         rHtml += `
         <tr class="hover:bg-blue-50/50 transition-colors border-b border-gray-100">
            <td class="px-4 py-4 font-mono text-sm text-gray-500">${id}</td>
            <td class="px-4 py-4 font-bold text-gray-800">${d.nama}</td>
            <td class="px-4 py-4 text-right font-mono font-bold text-blue-700 bg-blue-50/30">Rp ${d.saldo.toLocaleString('id-ID')}</td>
            <td class="px-4 py-4 text-right font-mono font-bold text-emerald-600 bg-emerald-50/30">Rp ${d.omzet.toLocaleString('id-ID')}</td>
            <td class="px-4 py-4 text-right font-mono font-bold text-indigo-600">Rp ${d.shodaqoh.toLocaleString('id-ID')}</td>
            <td class="px-4 py-4 text-right font-mono font-bold text-purple-600">Rp ${d.sewa.toLocaleString('id-ID')}</td>
         </tr>`;
      }

      // 5. TAMBAHAN: Baris Total Keseluruhan di Paling Bawah
      if (rHtml !== '') {
          rHtml += `
          <tr class="bg-gray-100 border-t-2 border-gray-300">
             <td colspan="2" class="px-4 py-5 text-right font-extrabold text-gray-700 uppercase tracking-widest text-xs">TOTAL KESELURUHAN:</td>
             <td class="px-4 py-5 text-right font-mono font-extrabold text-blue-800 bg-blue-100/50">Rp ${totSaldoDigital.toLocaleString('id-ID')}</td>
             <td class="px-4 py-5 text-right font-mono font-extrabold text-emerald-800 bg-emerald-100/50">Rp ${totOmzet.toLocaleString('id-ID')}</td>
             <td class="px-4 py-5 text-right font-mono font-extrabold text-indigo-800">Rp ${totShodaqoh.toLocaleString('id-ID')}</td>
             <td class="px-4 py-5 text-right font-mono font-extrabold text-purple-800">Rp ${totSewa.toLocaleString('id-ID')}</td>
          </tr>`;
      }

    // ==========================================
    // MESIN DOWNLOAD GAMBAR ID CARD
    // ==========================================
    window.downloadIDCard = function(namaSantri) {
        showToast('Sedang menyiapkan gambar, mohon tunggu...', 'info');
        
        // Memanggil "Kamera Layar" (html2canvas) secara otomatis
        if (typeof html2canvas === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            script.onload = () => eksekusiDownloadKartu(namaSantri);
            document.head.appendChild(script);
        } else {
            eksekusiDownloadKartu(namaSantri);
        }
    };

    function eksekusiDownloadKartu(namaSantri) {
        const elemenKartu = document.getElementById('id-card-render');
        
        // Memotret ID Card menjadi gambar dengan resolusi 3x lebih tajam
        html2canvas(elemenKartu, { scale: 3, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
            const namaFile = 'ID_Card_' + namaSantri.replace(/[^a-zA-Z0-9]/g, '_') + '.png';
            const link = document.createElement('a');
            link.download = namaFile;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('ID Card berhasil didownload! ✅');
        }).catch(err => {
            console.error(err);
            showToast('Gagal mendownload gambar. Silakan gunakan fitur cetak.', 'error');
        });
    }

    async function submitCashFlow() {
       const jenis = document.getElementById('cf-jenis').value;
       const desk = document.getElementById('cf-desk').value.trim();
       const nom = document.getElementById('cf-nom').value;
       
       if(!desk || !nom || nom <= 0) return alert('Mohon isi deskripsi dan nominal uangnya!');
       
       document.getElementById('main-content').innerHTML = '<div class="flex justify-center items-center h-64"><div class="animate-spin rounded-full h-12 w-12 border-4 border-emerald-200 border-t-emerald-600"></div></div>';
       
       // Proses simpan ke database dengan penangkap error
       const { error } = await supabaseClient.from('cashflow').insert([{ 
           tanggal: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }), 
           deskripsi: desk, 
           jenis: jenis, 
           nominal: parseInt(nom) 
       }]);
       
       // Jika Supabase menolak, munculkan peringatan
       if (error) {
           alert('Gagal menyimpan ke database: ' + error.message);
       }
       
       renderCashFlow();
    }

    async function hapusCashFlow(id) {
       if(!confirm('Yakin ingin menghapus catatan ini? Saldo akhir akan dihitung ulang secara otomatis.')) return;
       document.getElementById('main-content').innerHTML = '<div class="flex justify-center items-center h-64"><div class="animate-spin rounded-full h-12 w-12 border-4 border-emerald-200 border-t-emerald-600"></div></div>';
       
       await supabaseClient.from('cashflow').delete().eq('id', id);
       renderCashFlow();
    }
